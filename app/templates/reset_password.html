<!doctype html><html lang="en" data-theme="nexus"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose password · ArrNexus</title><link rel="stylesheet" href="/static/app.css"></head><body class="loginbody"><form class="login-card" method="post"><div class="loginbrand"><div class="brandmark big">AN</div><span class="eyebrow">ACCOUNT RECOVERY</span></div><h1>Choose a new password</h1>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<input type="hidden" name="token" value="{{ token }}"><label>New password<input type="password" name="password" minlength="8" required autofocus autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label><button class="btn primary">Update password</button><a class="login-help" href="/login">← Back to sign in</a></form></body></html>
