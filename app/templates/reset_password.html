<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050506"><title>Choose password · ArrNexus</title><link rel="icon" href="/static/arrnexus-icon-v9.png" type="image/png"><link rel="stylesheet" href="/static/app.css?v=9.3"></head><body class="v9-auth-body"><main class="v9-login-shell"><section class="v9-login-brand"><a href="/"><img src="/static/arrnexus-logo-v9.png" alt="ArrNexus"></a><h1>Choose a new password.<br><span>Return to your control plane.</span></h1><p>The reset token is single-use and time-limited. Your connected service credentials are not changed.</p></section><form class="v9-auth-card v9-login-card" method="post"><span class="v9-kicker">ACCOUNT RECOVERY</span><h2>Choose password</h2>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<input type="hidden" name="token" value="{{ token }}"><label>New password<input type="password" name="password" minlength="8" required autofocus autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label><button class="btn primary">Update password →</button><a class="v9-back-home" href="/login">← Back to sign in</a></form></main></body></html>
