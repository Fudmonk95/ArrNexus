{% extends "base.html" %}{% block title %}Music Settings · ArrNexus{% endblock %}
{% block content %}<div class="page-head"><div><h1>Spotify settings</h1><p>Configure the Spotify application used by Music Hub.</p></div><a class="button" href="/music">Back to Music Hub</a></div><section class="panel narrow"><form method="post" class="stack"><label>Client ID<input name="client_id" value="{{ client_id }}"></label><label>Client secret<input type="password" name="client_secret" placeholder="{{ 'Leave blank to keep current secret' if configured else 'Client secret' }}"></label><label>Market<input name="market" value="{{ market }}" maxlength="2"></label><button class="primary">Save Spotify settings</button></form></section>{% endblock %}
