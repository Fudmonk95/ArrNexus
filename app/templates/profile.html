{% extends "base.html" %}{% block title %}Profile · ArrNexus{% endblock %}{% block content %}<div class="page-head"><div><h1>Profile</h1><p>Local ArrNexus account.</p></div></div><section class="panel narrow"><form method="post" class="stack"><label>Username<input name="username" value="{{ user.username }}" required></label><label>Display name<input name="display_name" value="{{ user.display_name or '' }}"></label><label>Email<input name="email" value="{{ user.email or '' }}" type="email"></label><label>New password<input name="password" type="password" minlength="8" placeholder="Leave blank to keep current"></label><label>Confirm new password<input name="confirm_password" type="password"></label><button class="primary">Save profile</button></form></section>{% endblock %}
