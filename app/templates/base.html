<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}DMM Arr Router{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brandmark">DR</div>
      <div><strong>DMM Router</strong><span>Arr Bridge</span></div>
    </div>
    <nav>
      <a class="{% if request.url.path == '/' %}active{% endif %}" href="/">Dashboard</a>
      <a class="{% if request.url.path.startswith('/inbox') or request.url.path.startswith('/item') %}active{% endif %}" href="/inbox">DMM Inbox</a>
      <a class="{% if request.url.path.startswith('/libraries') %}active{% endif %}" href="/libraries">Libraries</a>
      <a class="{% if request.url.path.startswith('/arrs') %}active{% endif %}" href="/arrs">Arrs</a>
      <a class="{% if request.url.path.startswith('/music') %}active{% endif %}" href="/music">Music Search</a>
    </nav>
    <div class="sidefoot"><a href="/logout">Log out</a></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><span class="eyebrow">DMM → Arr → Jellyfin</span><h1>{% block heading %}Dashboard{% endblock %}</h1></div>
      <div class="pill">safe symlink mode</div>
    </header>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
