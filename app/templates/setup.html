{% extends "base.html" %}{% block title %}Set up ArrNexus{% endblock %}
{% block content %}
<div class="auth-card">
  <img class="auth-logo" src="/static/arrnexus-logo.png" alt="ArrNexus">
  <h1>Create the administrator</h1><p class="muted">This is a one-time setup for your personal ArrNexus instance.</p>
  <form method="post" class="stack">
    <label>Username<input name="username" required autocomplete="username"></label>
    <label>Display name<input name="display_name"></label>
    <label>Email<input name="email" type="email"></label>
    <label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
    <label>Confirm password<input name="confirm_password" type="password" minlength="8" required autocomplete="new-password"></label>
    <button class="primary" type="submit">Create administrator</button>
  </form>
</div>
{% endblock %}
