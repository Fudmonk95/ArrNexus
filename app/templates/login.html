<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · DMM Router</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="loginbody">
  <form class="login-card" method="post" action="/login">
    <div class="brand loginbrand"><div class="brandmark">DR</div><div><strong>DMM Router</strong><span>Arr Bridge</span></div></div>
    <h1>Sign in</h1>
    <p>Manage DMM imports, Arr destinations and music searches.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</body>
</html>
