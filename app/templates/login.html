{% extends "base.html" %}{% block title %}Sign in · ArrNexus{% endblock %}
{% block content %}
<div class="auth-card">
  <img class="auth-logo" src="/static/arrnexus-logo.png" alt="ArrNexus">
  <h1>Sign in</h1>
  <form method="post" class="stack">
    <label>Username or email<input name="identity" required autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
