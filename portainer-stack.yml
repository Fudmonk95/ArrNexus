services:
  arrnexus:
    image: arrnexus:v13.1.0
    container_name: arrnexus
    restart: unless-stopped
    ports:
      - "8484:8000"
    environment:
      DB_PATH: /data/router.db
      ARRNEXUS_PUBLIC_URL: ${ARRNEXUS_PUBLIC_URL:-}
      ZURG_ROOT: /zurg_mnt/zurg
      ZURG_CACHE_PATH: /host/zurg-rclone-cache
      MAGIC_ROOT: /zurg_magic
      MAGIC_ARR_PREFIX: /zurg_mnt/zurg/__magic__
      ZURG_URL: ${ZURG_URL:-http://192.168.137.10:9999}
      RADARR_URL: ${RADARR_URL:-http://192.168.137.10:7878}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_URL: ${SONARR_URL:-http://192.168.137.10:8989}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      LIDARR_URL: ${LIDARR_URL:-http://192.168.137.10:8686}
      LIDARR_API_KEY: ${LIDARR_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-http://192.168.137.10:9696}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-http://192.168.137.10:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      SEERR_URL: ${SEERR_URL:-http://192.168.137.10:5055}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      ARRNEXUS_SESSION_SECRET: ${ARRNEXUS_SESSION_SECRET:-}
      ARRNEXUS_HTTPS_ONLY: ${ARRNEXUS_HTTPS_ONLY:-false}
    volumes:
      - /mnt/appdata/arrnexus/data:/data
      - /mnt/appdata/zurg-rclone-cache:/host/zurg-rclone-cache:ro
      - type: bind
        source: /zurg_mnt/zurg/__magic__
        target: /zurg_magic
        read_only: false
        bind:
          propagation: rslave
      - type: bind
        source: /zurg_mnt
        target: /zurg_mnt
        read_only: true
        bind:
          propagation: rslave
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
