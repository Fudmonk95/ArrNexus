name: arrnexus-mediastack

x-common: &common
  restart: unless-stopped
  networks: [media]
  labels:
    arrnexus.mediastack: "true"

x-arr-env: &arr-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Europe/London}

services:
  stack-agent:
    <<: *common
    build:
      context: ./agent
    container_name: arrnexus-stack-agent
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      CONFIG_ROOT: /stack-config
      STACK_LABEL: arrnexus.mediastack=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config:/stack-config:ro
    ports:
      - "${STACK_AGENT_PORT:-8787}:8787"

  zurg:
    <<: *common
    image: ${ZURG_IMAGE:-ghcr.io/debridmediamanager/zurg-testing:latest}
    container_name: zurg
    volumes:
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/zurg/config.yml:/app/config.yml
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/zurg/data:/app/data
    ports:
      - "${ZURG_PORT:-9999}:9999"

  zurg-rclone:
    <<: *common
    image: ${RCLONE_IMAGE:-rclone/rclone:latest}
    container_name: zurg-rclone
    depends_on:
      - zurg
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    security_opt:
      - apparmor:unconfined
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/rclone:/config/rclone:ro
      - type: bind
        source: ${MEDIA_ROOT:-/mnt/arrnexus}/zurg
        target: /data
        bind:
          propagation: rshared
    command:
      - mount
      - zurg:
      - /data
      - --allow-other
      - --allow-non-empty
      - --dir-cache-time=10s
      - --vfs-cache-mode=full
      - --vfs-cache-max-size=${RCLONE_CACHE_MAX_SIZE:-20G}
      - --cache-dir=/tmp/rclone-cache

  sonarr:
    <<: *common
    image: ${SONARR_IMAGE:-lscr.io/linuxserver/sonarr:latest}
    container_name: sonarr
    environment: *arr-env
    volumes:
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/sonarr:/config
      - type: bind
        source: ${MEDIA_ROOT:-/mnt/arrnexus}/zurg
        target: /zurg
        read_only: true
        bind:
          propagation: rslave
    ports:
      - "${SONARR_PORT:-8989}:8989"

  radarr:
    <<: *common
    image: ${RADARR_IMAGE:-lscr.io/linuxserver/radarr:latest}
    container_name: radarr
    environment: *arr-env
    volumes:
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/radarr:/config
      - type: bind
        source: ${MEDIA_ROOT:-/mnt/arrnexus}/zurg
        target: /zurg
        read_only: true
        bind:
          propagation: rslave
    ports:
      - "${RADARR_PORT:-7878}:7878"

  lidarr:
    <<: *common
    image: ${LIDARR_IMAGE:-lscr.io/linuxserver/lidarr:latest}
    container_name: lidarr
    environment: *arr-env
    volumes:
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/lidarr:/config
      - type: bind
        source: ${MEDIA_ROOT:-/mnt/arrnexus}/zurg
        target: /zurg
        read_only: true
        bind:
          propagation: rslave
    ports:
      - "${LIDARR_PORT:-8686}:8686"

  prowlarr:
    <<: *common
    image: ${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr:latest}
    container_name: prowlarr
    environment: *arr-env
    volumes:
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/prowlarr:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"

  seerr:
    <<: *common
    image: ${SEERR_IMAGE:-ghcr.io/seerr-team/seerr:latest}
    container_name: seerr
    environment:
      TZ: ${TZ:-Europe/London}
      LOG_LEVEL: ${SEERR_LOG_LEVEL:-info}
    volumes:
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/seerr:/app/config
    ports:
      - "${SEERR_PORT:-5055}:5055"

  jellyfin:
    <<: *common
    image: ${JELLYFIN_IMAGE:-jellyfin/jellyfin:latest}
    container_name: jellyfin
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/jellyfin:/config
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/cache/jellyfin:/cache
      - type: bind
        source: ${MEDIA_ROOT:-/mnt/arrnexus}/zurg
        target: /media/zurg
        read_only: true
        bind:
          propagation: rslave
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"

  arrnexus:
    <<: *common
    build:
      context: ..
    image: ${ARRNEXUS_IMAGE:-arrnexus:mediastack}
    container_name: arrnexus
    environment:
      DB_PATH: /data/router.db
      ZURG_ROOT: /zurg
      MAGIC_ROOT: /zurg/__magic__
      MAGIC_ARR_PREFIX: /zurg/__magic__
      ZURG_URL: http://zurg:9999
      RADARR_URL: http://radarr:7878
      SONARR_URL: http://sonarr:8989
      LIDARR_URL: http://lidarr:8686
      PROWLARR_URL: http://prowlarr:9696
      JELLYFIN_URL: http://jellyfin:8096
      SEERR_URL: http://seerr:5055
      MEDIASTACK_AGENT_URL: http://stack-agent:8787
      ARRNEXUS_SESSION_SECRET: ${ARRNEXUS_SESSION_SECRET:-}
      ARRNEXUS_HTTPS_ONLY: ${ARRNEXUS_HTTPS_ONLY:-false}
    volumes:
      - ${STACK_ROOT:-/opt/arrnexus-mediastack}/config/arrnexus:/data
      - type: bind
        source: ${MEDIA_ROOT:-/mnt/arrnexus}/zurg
        target: /zurg
        read_only: true
        bind:
          propagation: rslave
    ports:
      - "${ARRNEXUS_PORT:-8484}:8000"
    depends_on:
      - stack-agent
      - zurg
      - sonarr
      - radarr
      - lidarr
      - prowlarr
      - seerr
      - jellyfin

networks:
  media:
    name: arrnexus-media
