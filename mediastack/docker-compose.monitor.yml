name: arrnexus-mediastack-monitor

services:
  stack-agent:
    build:
      context: ./agent
    container_name: arrnexus-stack-agent
    restart: unless-stopped
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      STACK_LABEL: arrnexus.mediastack=true
      STATE_ROOT: /state
      # Write actions remain locked unless BOTH this flag and a non-empty token
      # are supplied. The Docker socket bind itself cannot enforce read-only API
      # calls, so capability gating happens inside the narrow Stack Agent.
      WRITE_ENABLED: ${MEDIASTACK_WRITE_ENABLED:-false}
      AGENT_TOKEN: ${MEDIASTACK_AGENT_TOKEN:-}
      WRITE_ALLOWLIST: ${MEDIASTACK_WRITE_ALLOWLIST:-}
      GHCR_USERNAME: ${GHCR_USERNAME:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      STABILIZATION_SECONDS: ${MEDIASTACK_STABILIZATION_SECONDS:-10}
      HEALTH_TIMEOUT_SECONDS: ${MEDIASTACK_HEALTH_TIMEOUT_SECONDS:-120}
      WATCH_CONTAINERS: >-
        arrnexus,zurg,sonarr,radarr,lidarr,lidarr-postgres,prowlarr,seerrng,jellyfin,
        whisparr,bazarr,neutarr,maintainerr,profilarr,profilarr-parser,homarr
      CONFIG_ROOTS: >-
        zurg=/config-roots/zurg;
        arrnexus=/config-roots/arrnexus;
        sonarr=/config-roots/sonarr;
        radarr=/config-roots/radarr;
        lidarr=/config-roots/lidarr;
        prowlarr=/config-roots/prowlarr;
        seerrng=/config-roots/seerrng;
        jellyfin=/config-roots/jellyfin;
        whisparr=/config-roots/whisparr;
        bazarr=/config-roots/bazarr;
        neutarr=/config-roots/neutarr;
        maintainerr=/config-roots/maintainerr;
        profilarr=/config-roots/profilarr;
        homarr=/config-roots/homarr
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MEDIASTACK_STATE_DIR:-/opt/arrnexus-mediastack/state}:/state
      - /opt/zurg:/config-roots/zurg:ro
      - /mnt/appdata/arrnexus/data:/config-roots/arrnexus:ro
      - /home/renegademonk/docker/sonarr/config:/config-roots/sonarr:ro
      - /home/renegademonk/docker/radarr/config:/config-roots/radarr:ro
      - /home/renegademonk/docker/lidarr/config:/config-roots/lidarr:ro
      - /home/renegademonk/docker/prowlarr/config:/config-roots/prowlarr:ro
      - /home/renegademonk/docker/seerrng/config:/config-roots/seerrng:ro
      - /home/renegademonk/docker/jellyfin:/config-roots/jellyfin:ro
      - /home/renegademonk/docker/whisparr/config:/config-roots/whisparr:ro
      - /home/renegademonk/docker/bazarr/config:/config-roots/bazarr:ro
      - /home/renegademonk/docker/neutarr/config:/config-roots/neutarr:ro
      - /home/renegademonk/docker/maintainerr/data:/config-roots/maintainerr:ro
      - /home/renegademonk/docker/profilarr/config:/config-roots/profilarr:ro
      - /mnt/appdata/DUMB-metadata/homarr:/config-roots/homarr:ro
    ports:
      # Host-local only. ArrNexus reaches the agent over a shared Docker
      # network; no browser should talk to this port directly.
      - "127.0.0.1:${STACK_AGENT_PORT:-8787}:8787"
